[project]
name = "belo-horizonte"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "earthengine-api>=1.7.26",
    "econml>=0.16.0",
    "geedim>=1.9.1",
    "geemap>=0.37.2",
    "geopandas>=1.1.3",
    "ipykernel<7",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3.260113",
    "psmpy>=0.3.16",
    "pysal>=25.1",
    "scikit-learn>=1.6.1",
    "types-geopandas>=1.1.3.20260508",
]

[tool.ruff]
exclude = ["04_rosenbaum.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "PD010", "COM812"]

[tool.basedpyright]
typeCheckingMode = "standard"
ignore = ["**/*.ipynb"]

[tool.ty.src]
exclude = ["04_rosenbaum.ipynb"]

